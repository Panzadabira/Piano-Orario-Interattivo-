<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestore Piano Orario RS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .table-container {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .draggable {
            cursor: grab;
        }
        .draggable:active {
            cursor: grabbing;
        }
        .drop-zone {
            min-height: 80px;
            transition: background-color 0.2s ease;
        }
        .drag-over {
            background-color: #e5e7eb;
            border: 2px dashed #9ca3af;
            border-radius: 0.5rem;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        /* Forza la colonna categoria a restare visibile durante lo scroll orizzontale */
        .sticky-col {
            position: sticky;
            left: 0;
            z-index: 20;
            background-color: inherit;
        }
    </style>
</head>
<body class="p-4 md:p-8 lg:p-12 text-gray-800">

    <div class="max-w-full mx-auto">
        <!-- HEADER -->
        <div class="mb-8 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-800 mb-2">Gestore Piano Orario RS</h1>
                <p class="text-gray-600">Sincronizzazione Cloud attiva. Ogni modifica viene salvata in tempo reale.</p>
            </div>
            
            <div class="flex flex-wrap items-center gap-2">
                <!-- Stato Cloud -->
                <div class="flex items-center gap-2 mr-2 px-3 py-2 bg-white border border-gray-200 rounded-lg shadow-sm" id="cloud-status-container">
                    <div class="relative flex h-3 w-3">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-gray-400 opacity-75" id="cloud-ping"></span>
                      <span class="relative inline-flex rounded-full h-3 w-3 bg-gray-400" id="cloud-dot"></span>
                    </div>
                    <span id="cloud-text" class="text-xs font-semibold text-gray-600">Connessione...</span>
                </div>

                <!-- Backup JSON -->
                <div class="flex items-center gap-1 mr-2 pr-2 border-r border-gray-300">
                    <button onclick="window.exportData()" class="text-gray-600 hover:text-blue-600 font-semibold py-2 px-3 rounded-lg hover:bg-white transition flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                        Esporta
                    </button>
                    <button onclick="document.getElementById('importFile').click()" class="text-gray-600 hover:text-blue-600 font-semibold py-2 px-3 rounded-lg hover:bg-white transition flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                        Importa
                    </button>
                    <input type="file" id="importFile" class="hidden" accept=".json" onchange="window.importData(event)">
                </div>

                <!-- Gestione Struttura -->
                <button onclick="window.openColModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-4 rounded-lg transition">+ Colonna</button>
                <button onclick="window.openRowModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-4 rounded-lg transition">+ Riga</button>
                <button onclick="window.openModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow-md flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg>
                    Nuovo Task
                </button>
            </div>
        </div>

        <!-- TABELLA PRINCIPALE -->
        <div class="bg-white rounded-xl table-container border border-gray-200 overflow-x-auto mb-8">
            <table id="mainTable" class="w-full text-left border-collapse min-w-[1000px]">
                <thead>
                    <tr class="bg-gray-50 text-gray-700 text-xs uppercase tracking-wider border-b border-gray-200">
                        <th class="p-4 font-bold w-48 border-r border-gray-200 bg-gray-100 sticky-col shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">Categoria</th>
                        <!-- Le colonne verranno generate dinamicamente dal Cloud/JSON -->
                    </tr>
                </thead>
                <tbody class="text-gray-800 text-sm">
                    <!-- Le righe verranno generate dinamicamente -->
                </tbody>
            </table>
        </div>

        <!-- BACHECA BACKLOG -->
        <div class="bg-gray-100 p-6 border border-gray-300 rounded-xl mb-8">
            <h2 class="font-bold text-gray-700 mb-4 flex items-center gap-2 uppercase text-xs tracking-widest">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                Task non assegnati (Bacheca)
            </h2>
            <div id="backlog" class="drop-zone flex flex-wrap gap-4 min-h-[100px] items-center">
                <div class="text-sm text-gray-400 italic pointer-events-none" id="backlog-empty-text">Trascina qui i task per metterli in pausa.</div>
            </div>
        </div>
    </div>

    <!-- MODALE TASK -->
    <div id="addModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md mx-4">
            <h2 id="modalTitle" class="text-xl font-bold mb-4">Dettagli Task</h2>
            <form id="taskForm" onsubmit="window.submitNewTask(event)">
                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Titolo Task</label>
                    <input type="text" id="newTaskName" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Nota / Sottotitolo</label>
                    <input type="text" id="newTaskSub" placeholder="Es. Lunedì, Blocco A..." class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="mb-6">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Categoria Colore</label>
                    <select id="newTaskCategory" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="blue">Personale (Blu)</option>
                        <option value="green">Istruzione (Verde)</option>
                        <option value="orange">Logistica (Arancione)</option>
                        <option value="purple">Condotta (Viola)</option>
                        <option value="red">Urgenza (Rosso)</option>
                        <option value="gray">Generico (Grigio)</option>
                    </select>
                </div>
                <div class="flex justify-between items-center">
                    <button type="button" id="modalDeleteBtn" onclick="window.deleteTaskFromModal()" class="px-4 py-2 bg-red-50 text-red-600 font-bold rounded-lg hover:bg-red-100 hidden transition">ELIMINA</button>
                    <div class="flex gap-2 ml-auto">
                        <button type="button" onclick="window.closeModal()" class="px-4 py-2 text-gray-500 font-semibold hover:bg-gray-100 rounded-lg">Annulla</button>
                        <button type="submit" id="modalSubmitBtn" class="px-6 py-2 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 shadow-lg">SALVA</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- MODALE COLONNA -->
    <div id="addColModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md mx-4">
            <h2 id="colModalTitle" class="text-xl font-bold mb-4">Gestione Colonna</h2>
            <form id="colForm" onsubmit="window.submitNewCol(event)">
                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Nome Colonna</label>
                    <input type="text" id="newColName" required placeholder="Es. RS 16" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Nota Sotto</label>
                    <input type="text" id="newColSub" placeholder="Es. Lunedì - Venerdì" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div id="colPositionContainer" class="mb-6">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Posizione</label>
                    <select id="newColPosition" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none"></select>
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="window.closeColModal()" class="px-4 py-2 text-gray-500 font-semibold hover:bg-gray-100 rounded-lg">Annulla</button>
                    <button type="submit" id="colModalSubmitBtn" class="px-6 py-2 bg-gray-800 text-white font-bold rounded-lg hover:bg-black transition">AGGIUNGI</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODALE RIGA -->
    <div id="addRowModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md mx-4">
            <h2 class="text-xl font-bold mb-4">Aggiungi Nuova Riga</h2>
            <form id="rowForm" onsubmit="window.submitNewRow(event)">
                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Nome Categoria</label>
                    <input type="text" id="newRowName" required placeholder="Es. Logistica" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Colore Tema</label>
                    <select id="newRowCategory" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="blue">Blu</option>
                        <option value="green">Verde</option>
                        <option value="orange">Arancione</option>
                        <option value="purple">Viola</option>
                        <option value="red">Rosso</option>
                        <option value="gray">Grigio</option>
                    </select>
                </div>
                <div class="mb-6">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Posizione</label>
                    <select id="newRowPosition" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none"></select>
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="window.closeRowModal()" class="px-4 py-2 text-gray-500 font-semibold hover:bg-gray-100 rounded-lg">Annulla</button>
                    <button type="submit" class="px-6 py-2 bg-gray-800 text-white font-bold rounded-lg hover:bg-black transition">AGGIUNGI RIGA</button>
                </div>
            </form>
        </div>
    </div>

    <!-- LOGICA FIREBASE E INTERFACCIA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- CONFIGURAZIONE FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyDo2nhXSu-HurkyepSj-AMnUoqb96e8bS0",
            authDomain: "piano-orario-fu.firebaseapp.com",
            projectId: "piano-orario-fu",
            storageBucket: "piano-orario-fu.firebasestorage.app",
            messagingSenderId: "207245365594",
            appId: "1:207245365594:web:38af3cbd3bdfcb76c8a363",
            measurementId: "G-QV2P0LYEJH"
        };

        // VARIABILI GLOBALI
        window.taskCounter = Date.now(); // Usa il timestamp per evitare ID duplicati
        window.editingTaskId = null;
        window.editingColIndex = null;
        
        let db;
        let auth;
        let isUpdatingFromCloud = false;
        const appId = 'planner-rs-v1-main';

        // --- FUNZIONE PER LEGGERE IL JSON DA GITHUB COME BACKUP/AVVIO ---
        async function loadDataFromGitHub() {
            try {
                // Cerca il file piano_orario.json nella stessa cartella di GitHub
                const response = await fetch('./piano_orario.json');
                if (response.ok) {
                    const data = await response.json();
                    rebuildTableFromData(data);
                    return true;
                }
            } catch (error) {
                console.log("Nessun JSON locale trovato su GitHub o errore di caricamento.");
            }
            return false;
        }

        // --- INIZIALIZZAZIONE CLOUD ---
        try {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            updateCloudUI('connecting');
            
            // Autenticazione anonima per permettere la lettura/scrittura
            signInAnonymously(auth).then(() => {
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        setupCloudListener();
                    } else {
                        updateCloudUI('offline');
                        loadDataFromGitHub(); // Fallback se offline
                    }
                });
            }).catch(error => {
                console.error("Autenticazione fallita:", error);
                updateCloudUI('offline');
                loadDataFromGitHub(); // Fallback se fallisce l'autenticazione
            });
        } catch (error) {
            console.error("Inizializzazione Firebase fallita:", error);
            updateCloudUI('offline');
            loadDataFromGitHub(); // Fallback se fallisce l'avvio di Firebase
        }

        // --- GESTIONE STATO UI CLOUD ---
        function updateCloudUI(status) {
            const dot = document.getElementById('cloud-dot');
            const ping = document.getElementById('cloud-ping');
            const text = document.getElementById('cloud-text');
            
            if (status === 'offline') {
                dot.className = "relative inline-flex rounded-full h-3 w-3 bg-red-400";
                ping.classList.add('hidden');
                text.innerText = "Sincro Disabilitata";
            } else if (status === 'connecting') {
                dot.className = "relative inline-flex rounded-full h-3 w-3 bg-yellow-400";
                ping.classList.remove('hidden');
                text.innerText = "Connessione...";
            } else if (status === 'synced') {
                dot.className = "relative inline-flex rounded-full h-3 w-3 bg-green-500";
                ping.classList.add('hidden');
                text.innerText = "Cloud Attivo";
            } else if (status === 'saving') {
                dot.className = "relative inline-flex rounded-full h-3 w-3 bg-blue-500";
                ping.classList.remove('hidden');
                text.innerText = "Salvataggio...";
            }
        }

        // --- LETTURA DATI DAL CLOUD ---
        function setupCloudListener() {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'planner_state');
            
            onSnapshot(docRef, async (docSnap) => {
                if (docSnap.exists()) {
                    isUpdatingFromCloud = true;
                    rebuildTableFromData(docSnap.data());
                    
                    // Pausa per evitare loop di salvataggio durante l'aggiornamento
                    setTimeout(() => {
                        isUpdatingFromCloud = false;
                    }, 500);
                } else {
                    // SE IL CLOUD È VUOTO, PROVA PRIMA A LEGGERE IL JSON DA GITHUB
                    const loadedFromGithub = await loadDataFromGitHub();
                    
                    if (!loadedFromGithub) {
                        // Genera una tabella di base se anche il file locale non esiste
                        const initialData = {
                            columns: [
                                {name: 'RS 4', sub: ''}, 
                                {name: 'RS 8', sub: ''}, 
                                {name: 'RS 13', sub: ''}
                            ],
                            rows: [
                                {name: 'Personale', color: 'blue'}, 
                                {name: 'Istruzione', color: 'green'}
                            ],
                            tasks: []
                        };
                        rebuildTableFromData(initialData);
                    } else {
                        // Se ha caricato con successo il file da GitHub, salvalo sul Cloud!
                        window.saveToCloud();
                    }
                }
                updateCloudUI('synced');
            }, (err) => {
                console.error("Errore onSnapshot:", err);
                updateCloudUI('offline');
                loadDataFromGitHub(); // Fallback se c'è un blocco di permessi
            });
        }

        // --- SCRITTURA DATI SUL CLOUD ---
        window.saveToCloud = async function() {
            if (!db || !auth.currentUser || isUpdatingFromCloud) {
                return;
            }
            
            updateCloudUI('saving');
            
            try {
                const data = window.getPlannerData();
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'planner_state'), data);
                
                setTimeout(() => {
                    updateCloudUI('synced');
                }, 500);
            } catch (error) {
                console.error("Salvataggio fallito:", error);
                updateCloudUI('offline');
            }
        };

        // --- ESTRAZIONE DATI DALL'INTERFACCIA (per Cloud e Export JSON) ---
        window.getPlannerData = function() {
            const data = { 
                columns: [], 
                rows: [], 
                tasks: [] 
            };
            
            // Estrai colonne
            const ths = document.querySelectorAll('#mainTable thead th');
            for (let i = 1; i < ths.length; i++) {
                const nameNode = ths[i].querySelector('.col-name');
                const subNode = ths[i].querySelector('.col-sub');
                
                data.columns.push({
                    name: nameNode ? nameNode.innerText : '',
                    sub: subNode ? subNode.innerText : ''
                });
            }
            
            // Estrai righe
            const trs = document.querySelectorAll('#mainTable tbody tr');
            trs.forEach((tr, rowIndex) => {
                const tdCat = tr.querySelector('td:first-child');
                let rowColor = 'gray';
                
                // Cerca la classe del colore (es. text-blue-700)
                const match = tdCat.className.match(/text-([a-z]+)-700/);
                if (match) {
                    rowColor = match[1];
                }
                
                data.rows.push({ 
                    name: tdCat.innerText, 
                    color: rowColor 
                });
                
                // Estrai task nelle celle della griglia
                const tds = tr.querySelectorAll('td');
                for (let colIndex = 1; colIndex < tds.length; colIndex++) {
                    const dropZone = tds[colIndex].querySelector('.drop-zone');
                    if (dropZone) {
                        const tasksInZone = dropZone.querySelectorAll('.draggable');
                        tasksInZone.forEach(task => {
                            const titleNode = task.querySelector('.task-title');
                            const subNode = task.querySelector('.task-subtext');
                            
                            data.tasks.push({
                                id: task.id,
                                name: titleNode ? titleNode.innerText : '',
                                sub: subNode ? subNode.innerText : '',
                                color: task.getAttribute('data-color'),
                                location: { 
                                    type: 'grid', 
                                    rowIndex: rowIndex, 
                                    colIndex: colIndex - 1 
                                }
                            });
                        });
                    }
                }
            });
            
            // Estrai task nel backlog
            const backlogTasks = document.querySelectorAll('#backlog .draggable');
            backlogTasks.forEach(task => {
                const titleNode = task.querySelector('.task-title');
                const subNode = task.querySelector('.task-subtext');
                
                data.tasks.push({
                    id: task.id,
                    name: titleNode ? titleNode.innerText : '',
                    sub: subNode ? subNode.innerText : '',
                    color: task.getAttribute('data-color'),
                    location: { 
                        type: 'backlog' 
                    }
                });
            });
            
            return data;
        };

        // --- GESTIONE DRAG & DROP ---
        window.initDragAndDrop = function() {
            // Gestione elementi trascinabili (Draggables)
            const draggables = document.querySelectorAll('.draggable');
            draggables.forEach(draggable => {
                draggable.removeEventListener('dragstart', window.dragStart);
                draggable.removeEventListener('dragend', window.dragEnd);
                draggable.addEventListener('dragstart', window.dragStart);
                draggable.addEventListener('dragend', window.dragEnd);
            });

            // Gestione aree di rilascio (Drop Zones)
            const dropZones = document.querySelectorAll('.drop-zone');
            dropZones.forEach(zone => {
                zone.removeEventListener('dragover', window.dragOver);
                zone.removeEventListener('dragleave', window.dragLeave);
                zone.removeEventListener('drop', window.drop);
                zone.addEventListener('dragover', window.dragOver);
                zone.addEventListener('dragleave', window.dragLeave);
                zone.addEventListener('drop', window.drop);
            });
        };

        window.dragStart = function(event) {
            event.dataTransfer.setData('text/plain', event.target.id);
            setTimeout(() => {
                event.target.classList.add('opacity-40');
            }, 0);
        };

        window.dragEnd = function(event) {
            event.target.classList.remove('opacity-40');
            const dropZones = document.querySelectorAll('.drop-zone');
            dropZones.forEach(zone => {
                zone.classList.remove('drag-over');
            });
            window.checkBacklogEmpty();
        };

        window.dragOver = function(event) {
            event.preventDefault();
            const zone = event.target.closest('.drop-zone');
            if (zone) {
                zone.classList.add('drag-over');
            }
        };

        window.dragLeave = function(event) {
            const zone = event.target.closest('.drop-zone');
            if (zone) {
                zone.classList.remove('drag-over');
            }
        };

        window.drop = function(event) {
            event.preventDefault();
            const zone = event.target.closest('.drop-zone');
            const id = event.dataTransfer.getData('text/plain');
            const draggable = document.getElementById(id);
            
            if (zone && draggable) {
                zone.classList.remove('drag-over');
                zone.appendChild(draggable);
                window.saveToCloud();
            }
        };

        // --- GESTIONE MODALE TASK ---
        window.openModal = function() {
            window.editingTaskId = null;
            document.getElementById('taskForm').reset();
            document.getElementById('modalTitle').innerText = 'Nuovo Task';
            document.getElementById('modalDeleteBtn').classList.add('hidden');
            document.getElementById('addModal').classList.remove('hidden');
        };

        window.editTask = function(id, event) {
            if (event) { 
                event.preventDefault(); 
                event.stopPropagation(); 
            }
            window.editingTaskId = id;
            const el = document.getElementById(id);
            
            const titleNode = el.querySelector('.task-title');
            const subNode = el.querySelector('.task-subtext');
            
            document.getElementById('newTaskName').value = titleNode ? titleNode.innerText : '';
            document.getElementById('newTaskSub').value = subNode ? subNode.innerText : '';
            document.getElementById('newTaskCategory').value = el.getAttribute('data-color') || 'gray';
            
            document.getElementById('modalTitle').innerText = 'Modifica Task';
            document.getElementById('modalDeleteBtn').classList.remove('hidden');
            document.getElementById('addModal').classList.remove('hidden');
        };

        window.closeModal = function() {
            document.getElementById('addModal').classList.add('hidden');
            window.editingTaskId = null;
        };

        window.deleteTaskFromModal = function() {
            if (window.editingTaskId) {
                const el = document.getElementById(window.editingTaskId);
                if (el) {
                    el.remove();
                }
                window.saveToCloud();
                window.closeModal();
                window.checkBacklogEmpty();
            }
        };

        window.submitNewTask = function(event) {
            event.preventDefault();
            const name = document.getElementById('newTaskName').value;
            const sub = document.getElementById('newTaskSub').value;
            const color = document.getElementById('newTaskCategory').value;

            if (window.editingTaskId) {
                // Modifica task esistente
                const el = document.getElementById(window.editingTaskId);
                el.setAttribute('data-color', color);
                
                // Rimuovi classi colori precedenti
                const colors = ['blue', 'green', 'orange', 'purple', 'gray', 'red'];
                colors.forEach(c => {
                    el.classList.remove(`border-${c}-200`, `border-l-${c}-500`);
                });
                
                // Aggiungi nuove classi colore
                const borderClass = color === 'gray' ? 'gray-300' : `${color}-200`;
                const leftClass = color === 'gray' ? 'gray-500' : `${color}-500`;
                el.classList.add(`border-${borderClass}`, `border-l-${leftClass}`);
                
                // Aggiorna HTML interno
                el.innerHTML = window.getTaskHTML(window.editingTaskId, name, sub, color);
            } else {
                // Creazione nuovo task
                window.taskCounter++;
                const newId = 'task-' + window.taskCounter;
                const div = document.createElement('div');
                div.id = newId;
                div.draggable = true;
                
                const borderClass = color === 'gray' ? 'border-gray-300' : `border-${color}-200`;
                const leftClass = color === 'gray' ? 'border-l-gray-500' : `border-l-${color}-500`;
                
                div.className = `draggable bg-white border ${borderClass} p-3 rounded shadow-sm border-l-4 ${leftClass} relative group min-w-[150px]`;
                div.setAttribute('data-color', color);
                div.innerHTML = window.getTaskHTML(newId, name, sub, color);
                
                document.getElementById('backlog').appendChild(div);
            }
            
            window.closeModal();
            window.initDragAndDrop();
            window.saveToCloud();
        };

        // Generatore HTML interno del Task
        window.getTaskHTML = function(id, name, sub, color) {
            let html = '';
            if (sub) {
                html += `<span class="task-subtext inline-block bg-gray-100 text-gray-600 text-[10px] uppercase px-1.5 py-0.5 rounded mb-2 font-bold w-full text-center">${sub}</span>`;
            }
            html += `<span class="task-title font-semibold block text-center">${name}</span>`;
            html += `<button type="button" onclick="window.editTask('${id}', event)" class="absolute top-1 right-1 text-blue-400 opacity-0 group-hover:opacity-100 transition hover:text-blue-600"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" /></svg></button>`;
            return html;
        };

        // --- GESTIONE MODALE COLONNE ---
        window.openColModal = function() {
            window.editingColIndex = null;
            document.getElementById('colForm').reset();
            document.getElementById('colModalTitle').innerText = 'Aggiungi Colonna';
            document.getElementById('colPositionContainer').classList.remove('hidden');
            
            // Popola il menu a tendina delle posizioni
            const select = document.getElementById('newColPosition');
            select.innerHTML = '<option value="end">Alla fine</option>';
            
            const ths = document.querySelectorAll('thead th');
            ths.forEach((th, i) => {
                if (i > 0) {
                    const nameNode = th.querySelector('.col-name');
                    const colName = nameNode ? nameNode.innerText : `Colonna ${i}`;
                    select.innerHTML += `<option value="${i}">Prima di: ${colName}</option>`;
                }
            });
            
            document.getElementById('addColModal').classList.remove('hidden');
        };

        window.openEditColModal = function(btn) {
            const th = btn.closest('th');
            window.editingColIndex = th.cellIndex;
            
            const nameNode = th.querySelector('.col-name');
            const subNode = th.querySelector('.col-sub');
            
            document.getElementById('newColName').value = nameNode ? nameNode.innerText : '';
            document.getElementById('newColSub').value = subNode ? subNode.innerText : '';
            
            document.getElementById('colModalTitle').innerText = 'Modifica Colonna';
            document.getElementById('colPositionContainer').classList.add('hidden');
            document.getElementById('addColModal').classList.remove('hidden');
        };

        window.closeColModal = function() {
            document.getElementById('addColModal').classList.add('hidden');
        };

        window.submitNewCol = function(event) {
            event.preventDefault();
            const name = document.getElementById('newColName').value;
            const sub = document.getElementById('newColSub').value;
            
            const theadTr = document.querySelector('thead tr');
            const tbodyTrs = document.querySelectorAll('tbody tr');
            
            if (window.editingColIndex !== null) {
                // Modifica colonna
                const th = theadTr.children[window.editingColIndex];
                const nameNode = th.querySelector('.col-name');
                const subNode = th.querySelector('.col-sub');
                
                if (nameNode) nameNode.innerText = name;
                if (subNode) subNode.innerText = sub;
            } else {
                // Aggiunta colonna
                const pos = document.getElementById('newColPosition').value;
                const th = document.createElement('th');
                th.className = "p-4 font-semibold text-center border-r border-gray-200 relative group min-w-[150px]";
                
                let thHtml = `<div class="flex flex-col items-center justify-center">`;
                thHtml += `<span class="col-name text-gray-700">${name}</span>`;
                thHtml += `<span class="col-sub text-[10px] font-normal text-gray-400 mt-1">${sub}</span>`;
                thHtml += `</div>`;
                thHtml += `<div class="absolute top-1 right-1 opacity-0 group-hover:opacity-100 flex gap-1 bg-white border border-gray-300 rounded shadow-sm px-1 py-0.5 z-10 transition">`;
                thHtml += `<button onclick="window.moveCol(this, -1)" class="text-gray-400 hover:text-blue-600">&lt;</button>`;
                thHtml += `<button onclick="window.openEditColModal(this)" class="text-gray-400 hover:text-green-600 px-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>`;
                thHtml += `<button onclick="window.moveCol(this, 1)" class="text-gray-400 hover:text-blue-600">&gt;</button>`;
                thHtml += `</div>`;
                
                th.innerHTML = thHtml;
                
                if (pos === 'end') {
                    theadTr.appendChild(th);
                    tbodyTrs.forEach(tr => {
                        const td = document.createElement('td');
                        td.className = "border-r border-gray-200 align-top p-2";
                        td.innerHTML = '<div class="drop-zone flex flex-col gap-2 h-full min-h-[80px]"></div>';
                        tr.appendChild(td);
                    });
                } else {
                    const idx = parseInt(pos);
                    theadTr.insertBefore(th, theadTr.children[idx]);
                    tbodyTrs.forEach(tr => {
                        const td = document.createElement('td');
                        td.className = "border-r border-gray-200 align-top p-2";
                        td.innerHTML = '<div class="drop-zone flex flex-col gap-2 h-full min-h-[80px]"></div>';
                        tr.insertBefore(td, tr.children[idx]);
                    });
                }
            }
            
            window.closeColModal(); 
            window.initDragAndDrop(); 
            window.saveToCloud();
        };

        window.moveCol = function(btn, dir) {
            const th = btn.closest('th'); 
            const currentIndex = th.cellIndex; 
            const targetIndex = currentIndex + dir;
            const theadTr = th.parentNode;
            
            // Blocca spostamento oltre i limiti (o scambiandolo con la Categoria)
            if (targetIndex < 1 || targetIndex >= theadTr.children.length) {
                return;
            }
            
            // Sposta Header
            if (dir === 1) {
                theadTr.insertBefore(th, theadTr.children[targetIndex + 1]);
            } else {
                theadTr.insertBefore(th, theadTr.children[targetIndex]);
            }
            
            // Sposta Celle in tutte le righe
            const tbodyTrs = document.querySelectorAll('tbody tr');
            tbodyTrs.forEach(tr => {
                const td = tr.children[currentIndex];
                if (dir === 1) {
                    tr.insertBefore(td, tr.children[targetIndex + 1]);
                } else {
                    tr.insertBefore(td, tr.children[targetIndex]);
                }
            });
            
            window.saveToCloud();
        };

        // --- GESTIONE MODALE RIGHE ---
        window.openRowModal = function() {
            document.getElementById('rowForm').reset();
            const select = document.getElementById('newRowPosition');
            select.innerHTML = '<option value="end">Alla fine</option>';
            
            const trs = document.querySelectorAll('tbody tr');
            trs.forEach((tr, i) => {
                const tdCat = tr.querySelector('td');
                const catName = tdCat ? tdCat.innerText : `Riga ${i}`;
                select.innerHTML += `<option value="${i}">Prima di: ${catName}</option>`;
            });
            
            document.getElementById('addRowModal').classList.remove('hidden');
        };

        window.closeRowModal = function() {
            document.getElementById('addRowModal').classList.add('hidden');
        };

        window.submitNewRow = function(event) {
            event.preventDefault();
            const name = document.getElementById('newRowName').value;
            const color = document.getElementById('newRowCategory').value;
            const pos = document.getElementById('newRowPosition').value;
            
            const tr = document.createElement('tr');
            tr.className = "border-b border-gray-200 transition duration-150";
            
            const tdCat = document.createElement('td');
            tdCat.className = `p-4 font-bold text-${color}-700 bg-${color}-50/50 border-r border-gray-200 sticky-col shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]`;
            tdCat.innerText = name;
            tr.appendChild(tdCat);
            
            const colsCount = document.querySelectorAll('thead th').length - 1;
            for (let i = 0; i < colsCount; i++) {
                const td = document.createElement('td');
                td.className = "border-r border-gray-200 align-top p-2";
                td.innerHTML = '<div class="drop-zone flex flex-col gap-2 h-full min-h-[80px]"></div>';
                tr.appendChild(td);
            }
            
            const tbody = document.querySelector('tbody');
            if (pos === 'end') {
                tbody.appendChild(tr);
            } else {
                const idx = parseInt(pos);
                tbody.insertBefore(tr, tbody.children[idx]);
            }
            
            window.initDragAndDrop(); 
            window.closeRowModal(); 
            window.saveToCloud();
        };

        // --- IMPORTAZIONE E ESPORTAZIONE JSON LOCAL ---
        window.exportData = function() {
            const data = window.getPlannerData();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
            
            const a = document.createElement('a'); 
            a.href = dataStr; 
            a.download = "backup_piano_orario.json"; 
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };

        window.importData = function(event) {
            const file = event.target.files[0]; 
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    rebuildTableFromData(data);
                    window.saveToCloud();
                } catch (error) {
                    console.error("Errore importazione file:", error);
                    alert("Errore nell'importazione del file JSON.");
                }
            };
            reader.readAsText(file);
            
            // Resetta l'input file per permettere nuove ricariche dello stesso file
            event.target.value = '';
        };

        // --- FUNZIONE CENTRALE PER RICOSTRUIRE L'INTERA UI ---
        function rebuildTableFromData(data) {
            // 1. Svuota e rigenera Header (Colonne)
            const theadTr = document.querySelector('thead tr');
            theadTr.innerHTML = '<th class="p-4 font-bold w-48 border-r border-gray-200 bg-gray-100 sticky-col shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">Categoria</th>';
            
            data.columns.forEach(col => {
                const th = document.createElement('th');
                th.className = "p-4 font-semibold text-center border-r border-gray-200 relative group min-w-[150px]";
                
                let thHtml = `<div class="flex flex-col items-center justify-center">`;
                thHtml += `<span class="col-name text-gray-700">${col.name}</span>`;
                thHtml += `<span class="col-sub text-[10px] font-normal text-gray-400 mt-1">${col.sub}</span>`;
                thHtml += `</div>`;
                thHtml += `<div class="absolute top-1 right-1 opacity-0 group-hover:opacity-100 flex gap-1 bg-white border border-gray-300 rounded shadow-sm px-1 py-0.5 z-10 transition">`;
                thHtml += `<button onclick="window.moveCol(this, -1)" class="text-gray-400 hover:text-blue-600">&lt;</button>`;
                thHtml += `<button onclick="window.openEditColModal(this)" class="text-gray-400 hover:text-green-600 px-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>`;
                thHtml += `<button onclick="window.moveCol(this, 1)" class="text-gray-400 hover:text-blue-600">&gt;</button>`;
                thHtml += `</div>`;
                
                th.innerHTML = thHtml;
                theadTr.appendChild(th);
            });

            // 2. Svuota e rigenera Body (Righe e Celle)
            const tbody = document.querySelector('tbody'); 
            tbody.innerHTML = '';
            
            data.rows.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-gray-200 transition duration-150";
                
                const tdCat = document.createElement('td');
                tdCat.className = `p-4 font-bold text-${row.color}-700 bg-${row.color}-50/50 border-r border-gray-200 sticky-col shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]`;
                tdCat.innerText = row.name;
                tr.appendChild(tdCat);
                
                for(let i = 0; i < data.columns.length; i++) {
                    const td = document.createElement('td');
                    td.className = "border-r border-gray-200 align-top p-2";
                    td.innerHTML = '<div class="drop-zone flex flex-col gap-2 h-full min-h-[80px]"></div>';
                    tr.appendChild(td);
                }
                
                tbody.appendChild(tr);
            });

            // 3. Pulisce la bacheca (Backlog)
            const backlog = document.getElementById('backlog');
            const existingTasks = backlog.querySelectorAll('.draggable');
            existingTasks.forEach(el => el.remove());

            // 4. Distribuisce tutti i Task
            data.tasks.forEach(task => {
                const div = document.createElement('div'); 
                div.id = task.id; 
                div.draggable = true;
                
                const borderClass = task.color === 'gray' ? 'border-gray-300' : `border-${task.color}-200`;
                const leftClass = task.color === 'gray' ? 'border-l-gray-500' : `border-l-${task.color}-500`;
                
                div.className = `draggable bg-white border ${borderClass} p-3 rounded shadow-sm border-l-4 ${leftClass} relative group min-w-[150px]`;
                div.setAttribute('data-color', task.color);
                div.innerHTML = window.getTaskHTML(task.id, task.name, task.sub, task.color);
                
                if (task.location.type === 'backlog') {
                    backlog.appendChild(div);
                } else if (task.location.type === 'grid') {
                    const targetTr = tbody.children[task.location.rowIndex];
                    if (targetTr) {
                        const targetTd = targetTr.children[task.location.colIndex + 1]; // +1 per la colonna Categorie
                        if (targetTd) {
                            const dropZone = targetTd.querySelector('.drop-zone');
                            if (dropZone) {
                                dropZone.appendChild(div);
                            }
                        }
                    }
                }
            });
            
            // Riattiva Event Listeners e Controlli Visuali
            window.initDragAndDrop(); 
            window.checkBacklogEmpty();
        }

        window.checkBacklogEmpty = function() {
            const backlog = document.getElementById('backlog');
            const emptyText = document.getElementById('backlog-empty-text');
            const taskCount = backlog.querySelectorAll('.draggable').length;
            
            if (taskCount > 0) {
                emptyText.style.display = 'none';
            } else {
                emptyText.style.display = 'block';
            }
        };

        // --- AVVIO DELL'APP AL CARICAMENTO DELLA PAGINA ---
        document.addEventListener('DOMContentLoaded', () => { 
            window.initDragAndDrop(); 
            window.checkBacklogEmpty(); 
        });

    </script>
</body>
</html>
