<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestore Piano Orario RS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .table-container {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .draggable {
            cursor: grab;
        }
        .draggable:active {
            cursor: grabbing;
        }
        .drop-zone {
            min-height: 80px;
            transition: background-color 0.2s ease;
        }
        .drag-over {
            background-color: #e5e7eb;
            border: 2px dashed #9ca3af;
            border-radius: 0.5rem;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        /* Mantiene la colonna categoria visibile durante lo scroll orizzontale */
        .sticky-col {
            position: sticky;
            left: 0;
            z-index: 20;
            background-color: inherit;
        }
    </style>
</head>
<body class="p-4 md:p-8 lg:p-12 text-gray-800">

    <div class="max-w-full mx-auto">
        <!-- HEADER -->
        <div class="mb-8 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-800 mb-2">Gestore Piano Orario RS</h1>
                <p class="text-gray-600">Sincronizzazione Cloud attiva. I dati sono salvati nel tuo database Firebase.</p>
            </div>
            
            <div class="flex flex-wrap items-center gap-2">
                <!-- Stato Cloud -->
                <div class="flex items-center gap-2 mr-2 px-3 py-2 bg-white border border-gray-200 rounded-lg shadow-sm" id="cloud-status-container">
                    <div class="relative flex h-3 w-3">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-gray-400 opacity-75" id="cloud-ping"></span>
                      <span class="relative inline-flex rounded-full h-3 w-3 bg-gray-400" id="cloud-dot"></span>
                    </div>
                    <span id="cloud-text" class="text-xs font-semibold text-gray-600">Connessione...</span>
                </div>

                <!-- Backup JSON -->
                <div class="flex items-center gap-1 mr-2 pr-2 border-r border-gray-300">
                    <button onclick="window.exportData()" class="text-gray-600 hover:text-blue-600 font-semibold py-2 px-3 rounded-lg hover:bg-white transition flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                        Esporta
                    </button>
                    <button onclick="document.getElementById('importFile').click()" class="text-gray-600 hover:text-blue-600 font-semibold py-2 px-3 rounded-lg hover:bg-white transition flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                        Importa
                    </button>
                    <input type="file" id="importFile" class="hidden" accept=".json" onchange="window.importData(event)">
                </div>

                <!-- Gestione Struttura -->
                <button onclick="window.openColModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-4 rounded-lg transition">+ Colonna</button>
                <button onclick="window.openRowModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-4 rounded-lg transition">+ Riga</button>
                <button onclick="window.openModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow-md flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg>
                    Nuovo Task
                </button>
            </div>
        </div>

        <!-- TABELLA PRINCIPALE -->
        <div class="bg-white rounded-xl table-container border border-gray-200 overflow-x-auto mb-8">
            <table id="mainTable" class="w-full text-left border-collapse min-w-[1000px]">
                <thead>
                    <tr class="bg-gray-50 text-gray-700 text-xs uppercase tracking-wider border-b border-gray-200">
                        <th class="p-4 font-bold w-48 border-r border-gray-200 bg-gray-100 sticky-col shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">Categoria</th>
                        <!-- Colonne dinamiche -->
                    </tr>
                </thead>
                <tbody class="text-gray-800 text-sm">
                    <!-- Righe dinamiche -->
                </tbody>
            </table>
        </div>

        <!-- BACHECA BACKLOG -->
        <div class="bg-gray-100 p-6 border border-gray-300 rounded-xl mb-8">
            <h2 class="font-bold text-gray-700 mb-4 flex items-center gap-2 uppercase text-xs tracking-widest">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                Task non assegnati (Bacheca)
            </h2>
            <div id="backlog" class="drop-zone flex flex-wrap gap-4 min-h-[100px] items-center">
                <div class="text-sm text-gray-400 italic pointer-events-none" id="backlog-empty-text">Trascina qui i task per metterli in pausa.</div>
            </div>
        </div>
    </div>

    <!-- MODALI -->
    <div id="addModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md mx-4">
            <h2 id="modalTitle" class="text-xl font-bold mb-4">Dettagli Task</h2>
            <form id="taskForm" onsubmit="window.submitNewTask(event)">
                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Titolo Task</label>
                    <input type="text" id="newTaskName" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Nota / Sottotitolo</label>
                    <input type="text" id="newTaskSub" placeholder="Es. Lunedì, Blocco A..." class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="mb-6">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Categoria Colore</label>
                    <select id="newTaskCategory" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="blue">Personale (Blu)</option>
                        <option value="green">Istruzione (Verde)</option>
                        <option value="orange">Logistica (Arancione)</option>
                        <option value="purple">Condotta (Viola)</option>
                        <option value="red">Urgenza (Rosso)</option>
                        <option value="gray">Generico (Grigio)</option>
                    </select>
                </div>
                <div class="flex justify-between items-center">
                    <button type="button" id="modalDeleteBtn" onclick="window.deleteTaskFromModal()" class="px-4 py-2 bg-red-50 text-red-600 font-bold rounded-lg hover:bg-red-100 hidden transition">ELIMINA</button>
                    <div class="flex gap-2 ml-auto">
                        <button type="button" onclick="window.closeModal()" class="px-4 py-2 text-gray-500 font-semibold hover:bg-gray-100 rounded-lg">Annulla</button>
                        <button type="submit" id="modalSubmitBtn" class="px-6 py-2 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 shadow-lg">SALVA</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div id="addColModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md mx-4">
            <h2 id="colModalTitle" class="text-xl font-bold mb-4">Gestione Colonna</h2>
            <form id="colForm" onsubmit="window.submitNewCol(event)">
                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Nome Colonna</label>
                    <input type="text" id="newColName" required placeholder="Es. RS 16" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Nota Sotto</label>
                    <input type="text" id="newColSub" placeholder="Es. Lunedì - Venerdì" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div id="colPositionContainer" class="mb-6">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Posizione</label>
                    <select id="newColPosition" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none"></select>
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="window.closeColModal()" class="px-4 py-2 text-gray-500 font-semibold hover:bg-gray-100 rounded-lg">Annulla</button>
                    <button type="submit" id="colModalSubmitBtn" class="px-6 py-2 bg-gray-800 text-white font-bold rounded-lg hover:bg-black transition">SALVA</button>
                </div>
            </form>
        </div>
    </div>

    <div id="addRowModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md mx-4">
            <h2 class="text-xl font-bold mb-4">Aggiungi Nuova Riga</h2>
            <form id="rowForm" onsubmit="window.submitNewRow(event)">
                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Nome Categoria</label>
                    <input type="text" id="newRowName" required placeholder="Es. Logistica" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Colore Tema</label>
                    <select id="newRowCategory" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="blue">Blu</option>
                        <option value="green">Verde</option>
                        <option value="orange">Arancione</option>
                        <option value="purple">Viola</option>
                        <option value="red">Rosso</option>
                        <option value="gray">Grigio</option>
                    </select>
                </div>
                <div class="mb-6">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Posizione</label>
                    <select id="newRowPosition" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none"></select>
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="window.closeRowModal()" class="px-4 py-2 text-gray-500 font-semibold hover:bg-gray-100 rounded-lg">Annulla</button>
                    <button type="submit" class="px-6 py-2 bg-gray-800 text-white font-bold rounded-lg hover:bg-black transition">AGGIUNGI RIGA</button>
                </div>
            </form>
        </div>
    </div>

    <!-- LOGICA FIREBASE E INTERFACCIA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- CONFIGURAZIONE FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyDo2nhXSu-HurkyepSj-AMnUoqb96e8bS0",
            authDomain: "piano-orario-fu.firebaseapp.com",
            projectId: "piano-orario-fu",
            storageBucket: "piano-orario-fu.firebasestorage.app",
            messagingSenderId: "207245365594",
            appId: "1:207245365594:web:38af3cbd3bdfcb76c8a363",
            measurementId: "G-QV2P0LYEJH"
        };

        // VARIABILI GLOBALI
        window.taskCounter = Date.now();
        window.editingTaskId = null;
        window.editingColIndex = null;
        
        let db, auth;
        let isUpdatingFromCloud = false;
        const appId = 'planner-rs-v1-main';

        // --- FUNZIONE FALLBACK: CARICA JSON DA GITHUB ---
        async function loadDataFromGitHub() {
            try {
                const response = await fetch('./piano_orario.json');
                if (response.ok) {
                    const data = await response.json();
                    rebuildTableFromData(data);
                    return true;
                }
            } catch (error) {
                console.log("Fallback JSON non trovato.");
            }
            return false;
        }

        // --- INIZIALIZZAZIONE ---
        try {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            updateCloudUI('connecting');
            
            signInAnonymously(auth).then(() => {
                onAuthStateChanged(auth, (user) => {
                    if (user) setupCloudListener();
                    else { updateCloudUI('offline'); loadDataFromGitHub(); }
                });
            }).catch(e => { updateCloudUI('offline'); loadDataFromGitHub(); });
        } catch (e) {
            updateCloudUI('offline');
            loadDataFromGitHub();
        }

        // --- STATO CLOUD ---
        function updateCloudUI(status) {
            const dot = document.getElementById('cloud-dot');
            const ping = document.getElementById('cloud-ping');
            const text = document.getElementById('cloud-text');
            if (status === 'offline') {
                dot.className = "relative inline-flex rounded-full h-3 w-3 bg-red-400";
                ping.classList.add('hidden');
                text.innerText = "Sincro Disabilitata";
            } else if (status === 'connecting') {
                dot.className = "relative inline-flex rounded-full h-3 w-3 bg-yellow-400";
                ping.classList.remove('hidden');
                text.innerText = "Connessione...";
            } else if (status === 'synced') {
                dot.className = "relative inline-flex rounded-full h-3 w-3 bg-green-500";
                ping.classList.add('hidden');
                text.innerText = "Cloud Attivo";
            } else if (status === 'saving') {
                dot.className = "relative inline-flex rounded-full h-3 w-3 bg-blue-500";
                ping.classList.remove('hidden');
                text.innerText = "Salvataggio...";
            }
        }

        // --- ASCOLTO CLOUD (CORRETTO CON 6 SEGMENTI) ---
        function setupCloudListener() {
            // PERCORSO CORRETTO: artifacts / {appId} / public / data / planner_state / main
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'planner_state', 'main');
            
            onSnapshot(docRef, async (docSnap) => {
                if (docSnap.exists()) {
                    isUpdatingFromCloud = true;
                    rebuildTableFromData(docSnap.data());
                    setTimeout(() => { isUpdatingFromCloud = false; }, 500);
                } else {
                    const loaded = await loadDataFromGitHub();
                    if (!loaded) {
                        const initial = {
                            columns: [{name: 'RS 4', sub: ''}, {name: 'RS 8', sub: ''}, {name: 'RS 13', sub: ''}],
                            rows: [{name: 'Personale', color: 'blue'}, {name: 'Istruzione', color: 'green'}],
                            tasks: []
                        };
                        rebuildTableFromData(initial);
                    } else {
                        window.saveToCloud(); // Salva sul cloud i dati del JSON
                    }
                }
                updateCloudUI('synced');
            }, (err) => {
                updateCloudUI('offline');
                loadDataFromGitHub();
            });
        }

        // --- SALVATAGGIO CLOUD (CORRETTO CON 6 SEGMENTI) ---
        window.saveToCloud = async function() {
            if (!db || !auth.currentUser || isUpdatingFromCloud) return;
            updateCloudUI('saving');
            try {
                const data = window.getPlannerData();
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'planner_state', 'main');
                await setDoc(docRef, data);
                setTimeout(() => updateCloudUI('synced'), 500);
            } catch (e) { updateCloudUI('offline'); }
        };

        // --- ESTRAZIONE DATI ---
        window.getPlannerData = function() {
            const data = { columns: [], rows: [], tasks: [] };
            const ths = document.querySelectorAll('#mainTable thead th');
            for (let i = 1; i < ths.length; i++) {
                data.columns.push({
                    name: ths[i].querySelector('.col-name').innerText,
                    sub: ths[i].querySelector('.col-sub').innerText
                });
            }
            const trs = document.querySelectorAll('#mainTable tbody tr');
            trs.forEach((tr, rowIndex) => {
                const tdCat = tr.querySelector('td:first-child');
                let rowColor = 'gray';
                const match = tdCat.className.match(/text-([a-z]+)-700/);
                if (match) rowColor = match[1];
                data.rows.push({ name: tdCat.innerText, color: rowColor });
                const tds = tr.querySelectorAll('td');
                for (let colIndex = 1; colIndex < tds.length; colIndex++) {
                    const dropZone = tds[colIndex].querySelector('.drop-zone');
                    if (dropZone) {
                        dropZone.querySelectorAll('.draggable').forEach(task => {
                            data.tasks.push({
                                id: task.id,
                                name: task.querySelector('.task-title').innerText,
                                sub: task.querySelector('.task-subtext')?.innerText || '',
                                color: task.getAttribute('data-color'),
                                location: { type: 'grid', rowIndex: rowIndex, colIndex: colIndex - 1 }
                            });
                        });
                    }
                }
            });
            document.querySelectorAll('#backlog .draggable').forEach(task => {
                data.tasks.push({
                    id: task.id,
                    name: task.querySelector('.task-title').innerText,
                    sub: task.querySelector('.task-subtext')?.innerText || '',
                    color: task.getAttribute('data-color'),
                    location: { type: 'backlog' }
                });
            });
            return data;
        };

        // --- DRAG & DROP ---
        window.initDragAndDrop = function() {
            document.querySelectorAll('.draggable').forEach(d => {
                d.addEventListener('dragstart', e => {
                    e.dataTransfer.setData('text/plain', e.target.id);
                    e.target.classList.add('opacity-40');
                });
                d.addEventListener('dragend', e => {
                    e.target.classList.remove('opacity-40');
                    document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('drag-over'));
                    window.checkBacklogEmpty();
                });
            });
            document.querySelectorAll('.drop-zone').forEach(z => {
                z.addEventListener('dragover', e => { e.preventDefault(); e.target.closest('.drop-zone').classList.add('drag-over'); });
                z.addEventListener('dragleave', e => { e.target.closest('.drop-zone').classList.remove('drag-over'); });
                z.addEventListener('drop', e => {
                    e.preventDefault();
                    const zone = e.target.closest('.drop-zone');
                    const draggable = document.getElementById(e.dataTransfer.getData('text/plain'));
                    if (zone && draggable) { zone.appendChild(draggable); window.saveToCloud(); }
                });
            });
        };

        // --- AZIONI TASK ---
        window.openModal = function() {
            window.editingTaskId = null;
            document.getElementById('taskForm').reset();
            document.getElementById('modalTitle').innerText = 'Nuovo Task';
            document.getElementById('modalDeleteBtn').classList.add('hidden');
            document.getElementById('addModal').classList.remove('hidden');
        };

        window.editTask = function(id, event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            window.editingTaskId = id;
            const el = document.getElementById(id);
            document.getElementById('newTaskName').value = el.querySelector('.task-title').innerText;
            document.getElementById('newTaskSub').value = el.querySelector('.task-subtext')?.innerText || '';
            document.getElementById('newTaskCategory').value = el.getAttribute('data-color') || 'gray';
            document.getElementById('modalTitle').innerText = 'Modifica Task';
            document.getElementById('modalDeleteBtn').classList.remove('hidden');
            document.getElementById('addModal').classList.remove('hidden');
        };

        window.submitNewTask = function(e) {
            e.preventDefault();
            const name = document.getElementById('newTaskName').value;
            const sub = document.getElementById('newTaskSub').value;
            const color = document.getElementById('newTaskCategory').value;
            if (window.editingTaskId) {
                const el = document.getElementById(window.editingTaskId);
                el.setAttribute('data-color', color);
                const colors = ['blue', 'green', 'orange', 'purple', 'gray', 'red'];
                colors.forEach(c => el.classList.remove(`border-${c}-200`, `border-l-${c}-500`));
                el.classList.add(`border-${color === 'gray' ? 'gray-300' : color + '-200'}`, `border-l-${color === 'gray' ? 'gray-500' : color + '-500'}`);
                el.innerHTML = window.getTaskHTML(window.editingTaskId, name, sub, color);
            } else {
                window.taskCounter++;
                const newId = 'task-' + window.taskCounter;
                const div = document.createElement('div');
                div.id = newId; div.draggable = true;
                const bC = color === 'gray' ? 'gray-300' : `${color}-200`;
                const lC = color === 'gray' ? 'gray-500' : `${color}-500`;
                div.className = `draggable bg-white border border-${bC} p-3 rounded shadow-sm border-l-4 border-l-${lC} relative group min-w-[150px]`;
                div.setAttribute('data-color', color);
                div.innerHTML = window.getTaskHTML(newId, name, sub, color);
                document.getElementById('backlog').appendChild(div);
            }
            window.closeModal(); window.initDragAndDrop(); window.saveToCloud();
        };

        window.getTaskHTML = (id, name, sub, color) => `
            ${sub ? `<span class="task-subtext inline-block bg-gray-100 text-gray-600 text-[10px] uppercase px-1.5 py-0.5 rounded mb-2 font-bold w-full text-center">${sub}</span>` : ''}
            <span class="task-title font-semibold block text-center">${name}</span>
            <button type="button" onclick="window.editTask('${id}', event)" class="absolute top-1 right-1 text-blue-400 opacity-0 group-hover:opacity-100 transition hover:text-blue-600"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" /></svg></button>
        `;

        window.deleteTaskFromModal = () => { if (window.editingTaskId) { document.getElementById(window.editingTaskId).remove(); window.saveToCloud(); window.closeModal(); window.checkBacklogEmpty(); }};
        window.closeModal = () => document.getElementById('addModal').classList.add('hidden');

        // --- AZIONI COLONNE ---
        window.openColModal = () => {
            window.editingColIndex = null;
            document.getElementById('colForm').reset();
            document.getElementById('colModalTitle').innerText = 'Aggiungi Colonna';
            document.getElementById('colPositionContainer').classList.remove('hidden');
            const select = document.getElementById('newColPosition');
            select.innerHTML = '<option value="end">Alla fine</option>';
            document.querySelectorAll('thead th').forEach((th, i) => { if (i > 0) select.innerHTML += `<option value="${i}">Prima di: ${th.querySelector('.col-name').innerText}</option>`; });
            document.getElementById('addColModal').classList.remove('hidden');
        };

        window.openEditColModal = (btn) => {
            const th = btn.closest('th');
            window.editingColIndex = th.cellIndex;
            document.getElementById('newColName').value = th.querySelector('.col-name').innerText;
            document.getElementById('newColSub').value = th.querySelector('.col-sub').innerText;
            document.getElementById('colModalTitle').innerText = 'Modifica Colonna';
            document.getElementById('colPositionContainer').classList.add('hidden');
            document.getElementById('addColModal').classList.remove('hidden');
        };

        window.submitNewCol = (e) => {
            e.preventDefault();
            const name = document.getElementById('newColName').value;
            const sub = document.getElementById('newColSub').value;
            if (window.editingColIndex !== null) {
                const th = document.querySelector('thead tr').children[window.editingColIndex];
                th.querySelector('.col-name').innerText = name;
                th.querySelector('.col-sub').innerText = sub;
            } else {
                const pos = document.getElementById('newColPosition').value;
                const th = document.createElement('th');
                th.className = "p-4 font-semibold text-center border-r border-gray-200 relative group min-w-[150px]";
                th.innerHTML = `<div class="flex flex-col items-center justify-center"><span class="col-name text-gray-700">${name}</span><span class="col-sub text-[10px] font-normal text-gray-400 mt-1">${sub}</span></div>
                    <div class="absolute top-1 right-1 opacity-0 group-hover:opacity-100 flex gap-1 bg-white border border-gray-300 rounded shadow-sm px-1 py-0.5 z-10 transition">
                        <button onclick="window.moveCol(this, -1)" class="text-gray-400 hover:text-blue-600">&lt;</button>
                        <button onclick="window.openEditColModal(this)" class="text-gray-400 hover:text-green-600 px-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
                        <button onclick="window.moveCol(this, 1)" class="text-gray-400 hover:text-blue-600">&gt;</button>
                    </div>`;
                const thead = document.querySelector('thead tr');
                if (pos === 'end') {
                    thead.appendChild(th);
                    document.querySelectorAll('tbody tr').forEach(tr => { const td = document.createElement('td'); td.className = "border-r border-gray-200 align-top p-2"; td.innerHTML = '<div class="drop-zone flex flex-col gap-2 h-full min-h-[80px]"></div>'; tr.appendChild(td); });
                } else {
                    const idx = parseInt(pos);
                    thead.insertBefore(th, thead.children[idx]);
                    document.querySelectorAll('tbody tr').forEach(tr => { const td = document.createElement('td'); td.className = "border-r border-gray-200 align-top p-2"; td.innerHTML = '<div class="drop-zone flex flex-col gap-2 h-full min-h-[80px]"></div>'; tr.insertBefore(td, tr.children[idx]); });
                }
            }
            document.getElementById('addColModal').classList.add('hidden'); window.initDragAndDrop(); window.saveToCloud();
        };

        window.moveCol = (btn, dir) => {
            const th = btn.closest('th'); const cur = th.cellIndex; const tar = cur + dir;
            if (tar < 1 || tar >= th.parentNode.children.length) return;
            th.parentNode.insertBefore(th, dir === 1 ? th.parentNode.children[tar + 1] : th.parentNode.children[tar]);
            document.querySelectorAll('tbody tr').forEach(tr => tr.insertBefore(tr.children[cur], dir === 1 ? tr.children[tar + 1] : tr.children[tar]));
            window.saveToCloud();
        };

        window.closeColModal = () => document.getElementById('addColModal').classList.add('hidden');

        // --- AZIONI RIGHE ---
        window.openRowModal = () => {
            document.getElementById('rowForm').reset();
            const select = document.getElementById('newRowPosition');
            select.innerHTML = '<option value="end">Alla fine</option>';
            document.querySelectorAll('tbody tr').forEach((tr, i) => { select.innerHTML += `<option value="${i}">Prima di: ${tr.querySelector('td').innerText}</option>`; });
            document.getElementById('addRowModal').classList.remove('hidden');
        };

        window.submitNewRow = (e) => {
            e.preventDefault();
            const name = document.getElementById('newRowName').value;
            const color = document.getElementById('newRowCategory').value;
            const pos = document.getElementById('newRowPosition').value;
            const tr = document.createElement('tr'); tr.className = "border-b border-gray-200 transition duration-150";
            const tdCat = document.createElement('td');
            tdCat.className = `p-4 font-bold text-${color}-700 bg-${color}-50/50 border-r border-gray-200 sticky-col shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]`;
            tdCat.innerText = name; tr.appendChild(tdCat);
            const colsCount = document.querySelectorAll('thead th').length - 1;
            for (let i = 0; i < colsCount; i++) { const td = document.createElement('td'); td.className = "border-r border-gray-200 align-top p-2"; td.innerHTML = '<div class="drop-zone flex flex-col gap-2 h-full min-h-[80px]"></div>'; tr.appendChild(td); }
            const tbody = document.querySelector('tbody');
            if (pos === 'end') tbody.appendChild(tr); else tbody.insertBefore(tr, tbody.children[parseInt(pos)]);
            window.initDragAndDrop(); document.getElementById('addRowModal').classList.add('hidden'); window.saveToCloud();
        };

        window.closeRowModal = () => document.getElementById('addRowModal').classList.add('hidden');

        // --- IMPORT/EXPORT ---
        window.exportData = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(window.getPlannerData(), null, 2));
            const a = document.createElement('a'); a.href = dataStr; a.download = "backup_piano_orario.json"; a.click();
        };

        window.importData = (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => { try { rebuildTableFromData(JSON.parse(ev.target.result)); window.saveToCloud(); } catch (err) { alert("Errore JSON."); } };
            reader.readAsText(file); e.target.value = '';
        };

        // --- RICOSTRUZIONE UI ---
        function rebuildTableFromData(data) {
            const theadTr = document.querySelector('thead tr');
            theadTr.innerHTML = '<th class="p-4 font-bold w-48 border-r border-gray-200 bg-gray-100 sticky-col shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">Categoria</th>';
            data.columns.forEach(col => {
                const th = document.createElement('th'); th.className = "p-4 font-semibold text-center border-r border-gray-200 relative group min-w-[150px]";
                th.innerHTML = `<div class="flex flex-col items-center justify-center"><span class="col-name text-gray-700">${col.name}</span><span class="col-sub text-[10px] font-normal text-gray-400 mt-1">${col.sub}</span></div>
                    <div class="absolute top-1 right-1 opacity-0 group-hover:opacity-100 flex gap-1 bg-white border border-gray-300 rounded shadow-sm px-1 py-0.5 z-10 transition">
                        <button onclick="window.moveCol(this, -1)" class="text-gray-400 hover:text-blue-600">&lt;</button>
                        <button onclick="window.openEditColModal(this)" class="text-gray-400 hover:text-green-600 px-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
                        <button onclick="window.moveCol(this, 1)" class="text-gray-400 hover:text-blue-600">&gt;</button>
                    </div>`;
                theadTr.appendChild(th);
            });
            const tbody = document.querySelector('tbody'); tbody.innerHTML = '';
            data.rows.forEach(row => {
                const tr = document.createElement('tr'); tr.className = "border-b border-gray-200 transition duration-150";
                const tdCat = document.createElement('td'); tdCat.className = `p-4 font-bold text-${row.color}-700 bg-${row.color}-50/50 border-r border-gray-200 sticky-col shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]`;
                tdCat.innerText = row.name; tr.appendChild(tdCat);
                for (let i = 0; i < data.columns.length; i++) { const td = document.createElement('td'); td.className = "border-r border-gray-200 align-top p-2"; td.innerHTML = '<div class="drop-zone flex flex-col gap-2 h-full min-h-[80px]"></div>'; tr.appendChild(td); }
                tbody.appendChild(tr);
            });
            const backlog = document.getElementById('backlog'); backlog.querySelectorAll('.draggable').forEach(el => el.remove());
            data.tasks.forEach(task => {
                const div = document.createElement('div'); div.id = task.id; div.draggable = true;
                const bC = task.color === 'gray' ? 'gray-300' : `${task.color}-200`;
                const lC = task.color === 'gray' ? 'gray-500' : `${task.color}-500`;
                div.className = `draggable bg-white border border-${bC} p-3 rounded shadow-sm border-l-4 border-l-${lC} relative group min-w-[150px]`;
                div.setAttribute('data-color', task.color); div.innerHTML = window.getTaskHTML(task.id, task.name, task.sub, task.color);
                if (task.location.type === 'backlog') backlog.appendChild(div);
                else { const targetTd = tbody.children[task.location.rowIndex]?.children[task.location.colIndex + 1]; if (targetTd) targetTd.querySelector('.drop-zone').appendChild(div); }
            });
            window.initDragAndDrop(); window.checkBacklogEmpty();
        }

        window.checkBacklogEmpty = function() {
            document.getElementById('backlog-empty-text').style.display = document.getElementById('backlog').querySelectorAll('.draggable').length > 0 ? 'none' : 'block';
        };

        document.addEventListener('DOMContentLoaded', () => { window.initDragAndDrop(); window.checkBacklogEmpty(); });
    </script>
</body>
</html>
